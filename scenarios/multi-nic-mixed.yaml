# Two NICs with independent configuration: one DHCP with DNS overrides
# (runcmd workaround applies to this one only), one static.
hostname: cinit-multi-nic
user: manu
password: Test1234!
nics:
  - name: enp1s0
    mode: dhcp
    dns: ["8.8.8.8"]
    ignore_auto_dns: true
  - name: enp2s0
    mode: static
    address: 10.10.10.5/24
    gateway: 10.10.10.1
