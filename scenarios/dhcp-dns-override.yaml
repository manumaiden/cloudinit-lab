# Reproduces the "DHCP address, but DNS settings from network-config are
# silently ignored by the NetworkManager renderer" class of bug (observed on
# RHEL 10.2 — see ~/claudeproject/cloudinit for the original manual repro).
# The DNS-related fields below trigger the runcmd workaround automatically.
hostname: cinit-dhcp-dns
user: manu
password: Test1234!
nics:
  - name: enp1s0
    mode: dhcp
    dns: ["8.8.8.8", "1.1.1.1"]
    dns_search: ["lab.example.com"]
    ignore_auto_dns: true
    dhcp_hostname: cinit-dhcp-dns.lab.example.com
