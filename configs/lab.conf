# cloudinit-lab configuration template.
# Copied to ~/.cloudinit-lab.conf on first install (install.sh); edit the
# copy in your home directory, not this file, to keep local settings out of
# the repo.

# Default VM resources
DEFAULT_RAM=2048
DEFAULT_VCPUS=2

# Storage paths (leave empty to use defaults: images/ and vms/ next to the repo)
IMAGES_DIR=""
VMS_DIR=""

# Folder scanned for reusable scenario profiles (leave empty to use the
# bundled scenarios/ directory)
SCENARIOS_DIR=""
